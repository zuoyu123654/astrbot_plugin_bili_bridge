name: astrbot_plugin_bili_bridge
display_name: B站动态记忆桥
short_desc: 把 B站 每日挑选写进 AI 记忆，被问细节时自动拉字幕；说一句「刷视频」就让她去刷一轮
desc: >-
  让 QQ 里的 AI 真正「看过」你 B站 账号今天刷了什么。

  它做三件事：

  1. **记忆同步**：定时读取 B站 侧的挑选结果（默认是刷视频类工具写出的
  `digest/YYYY-MM.md`），压成一小段清单写进 MemoryCompanion 的核心记忆块，
  每轮对话都会带上——于是你问「B站 今天看了什么」，它答得出来。

  2. **按需解析**：注册 `bilibili_read` 工具。你追问某条视频讲了什么时，
  它会调用本机 bili-cli 拉取字幕和元数据，**按原文讲解**，而不是照抄摘要。
  没有字幕时退回 B站 官方 AI 总结。

  3. **说一句就刷一轮**：在 QQ 上说「刷视频 / 刷B站 / 看视频」，它就转给 DSH 那边的
  刷B站（dsh-bili-scroll）**真跑一轮**，跑完把这一轮挑到的几条（标题 + 理由 + 链接）
  发回同一个会话。用的是那个插件自己的接口，不复制它的业务逻辑。

  另外它会处理 QQ 的「分享视频」卡片（JSON 消息没有文字，
  链接藏在卡片里，`b23.tv` 短链会自动跟随解析），所以直接转发视频过来也能分析。

  **全程本地**：所有请求都走本机 bili-cli 与本机 DSH 网关，不经过任何第三方解析接口。
version: 0.6.0
author: paopao
repo: https://github.com/Liuxuenin/astrbot_plugin_bili_bridge
astrbot_version: ">=4.17.0"
support_platforms:
  - aiocqhttp
tags:
  - B站
  - 记忆
  - 视频
  - 字幕

